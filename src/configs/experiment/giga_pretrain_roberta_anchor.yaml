# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /modality_encoder: siglip-roberta
  - override /dataset: giga_pretrain
  - override /model/encoder: siglip_encoder
  - override /model/scheduler: pretrain
  - override /model/loss: anchor_contrastive_loss
  - override /trainer: gpu
  - _self_

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["GIGA-pretrain", "v1", "siglip-roberta", "disco"]

seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 10
  # gradient_clip_val: 0.5

logger:
  wandb:
    tags: ${tags}
    group: "giga_pretrain_roberta"
  aim:
    experiment: "giga_pretrain_roberta"

model:
  loss:
    num_classes: 6
    learnable_temperature: True
    temperature: 0.3
  encoder:
    freeze_initial_encoders: False
    block_size: 1
    graph_token_average: False
    embedding_dim: 768
    graph_stack_factory:
      graph_tfmr_factory:
        ffn_dim: 3072
  scheduler:
    dataset_steps: 18737 # Total is 412,080
  optimizer:
    lr: 3e-5

dataset:
  train_batch_size: 20
  max_total_length: null
  test_batch_size: 20
  group_size: 1

task_name: "pretrain"
