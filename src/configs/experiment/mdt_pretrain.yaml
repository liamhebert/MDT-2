# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /modality_encoder: bert-vit-base
  - override /dataset: giga_pretrain
  - override /model/encoder: mdt
  - override /model/loss: anchor_contrastive_loss
  - override /model/scheduler: pretrain
  - override /trainer: ddp
  - _self_

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["pretrain", "v1", "bert-vit-base", "mdt"]

seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 10
  # gradient_clip_val: 0.5

logger:
  wandb:
    tags: ${tags}
    group: "pretrain_mdt"
    project: "pretrain_mdt"
  aim:
    experiment: "pretrain_mdt"

model:
  loss:
    num_classes: 6
  encoder:
    block_size: 1
    graph_token_average: False
    freeze_initial_encoders: True
  optimizer:
    lr: 3e-5
  scheduler:
    dataset_steps: 18737

dataset:
  dataset:
    spatial_pos_max: 10
    max_attn_distance: 5
    force_tag: "pretrain_mdt_split"

  train_batch_size: 20
  test_batch_size: 20
  max_total_length: null

task_name: "mdt_pretrain"
