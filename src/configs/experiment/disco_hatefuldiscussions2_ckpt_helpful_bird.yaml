# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /modality_encoder: siglip-roberta
  - override /dataset: hateful_discussions
  - override /model/encoder: siglip_encoder
  - override /model/loss: cross_entropy
  - override /model/scheduler: finetune
  - override /trainer: ddp
  - _self_

tags: ["HD2", "v1", "siglip-roberta", "disco", "pretrained"]


trainer:
  min_epochs: 1
  max_epochs: 10
  # gradient_clip_val: 0.5

logger:
  wandb:
    tags: ${tags}
    group: "hd2_disco"
    project: "hd2_disco"
  aim:
    experiment: "hd2_disco"

model:
  loss:
    num_classes: 2
    output_head:
      input_dim: 768
  encoder:
    block_size: 1
    graph_token_average: False
    freeze_initial_encoders: False
    concat_graph_to_node: False
    embedding_dim: 768
    graph_stack_factory:
      graph_tfmr_factory:
        differential_attention: False
        ffn_dim: 3072
        head_dim: 128
        n_heads: 16
        n_kv_heads: 16
        rope_mixed: True
        use_rope: True
      num_layers: 4
    num_bottle_neck: 4
    num_fusion_stack: 4
  optimizer:
    lr: 0.000005
  scheduler:
    dataset_steps: 9999999

# https://wandb.ai/multi-modal-uwaterloo/DisCo/runs/gmetay5x
ckpt_path: "/u2/l2hebert/MDT-2/src/logs/pretrain/multiruns/2025-05-11_23-59-20/0/checkpoints/epoch_009.ckpt"

dataset:
  dataset:
    force_tag: "HD2_disco_split"
    split_graphs: True

  train_batch_size: 24
  test_batch_size: 24
  max_total_length: null

task_name: "disco_hd2"
