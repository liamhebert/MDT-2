# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /modality_encoder: siglip-UAE
  - override /dataset: giga_pretrain
  - override /model/encoder: siglip_encoder
  - override /model/scheduler: pretrain
  - override /model/loss: anchor_contrastive_loss
  - override /trainer: ddp
  - _self_

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["GIGA-pretrain", "v1.5", "siglip-UAE", "disco"]

seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 10
  # gradient_clip_val: 0.5

logger:
  wandb:
    tags: ${tags}
    group: "giga_pretrain"
  aim:
    experiment: "giga_pretrain"

model:
  loss:
    num_classes: 6
    learnable_temperature: True
    temperature: 0.3
  encoder:
    freeze_initial_encoders: True
    block_size: 1
    graph_token_average: False
  scheduler:
    dataset_steps: 18737 # Total is 412,080
  optimizer:
    lr: 3e-5

dataset:
  train_batch_size: 40
  max_total_length: null
  test_batch_size: 40
  group_size: 1

task_name: "pretrain"
