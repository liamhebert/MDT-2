# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /modality_encoder: embedding-gemma
  - override /dataset: giga_pretrain
  - override /model/encoder: base_v3
  - override /model/scheduler: pretrain
  - override /model/loss: supervised_contrastive_loss_with_ce
  - override /trainer: gpu
  - _self_

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["GIGA-pretrain", "v3", "gemma", "disco"]

seed: 12345

trainer:
  min_epochs: 1
  max_epochs: 10
  gradient_clip_val: 0.5

logger:
  wandb:
    tags: ${tags}
    group: "giga_pretrain_gemma"
  aim:
    experiment: "giga_pretrain_gemma"

model:
  loss:
    num_classes: 6
    learnable_temperature: True
    temperature: 0.1
    lambda_contrastive: 0.3
    projection_dim: 3072
  encoder:
    embedding_dim: 768
    block_size: 1
    graph_stack_factory:
      graph_tfmr_factory:
        ffn_dim: 2048
      num_layers: 4
  scheduler:
    dataset_steps: 18737 # Total is 412,080
  optimizer:
    lr: 3e-4

dataset:
  train_batch_size: 10
  max_total_length: null
  test_batch_size: 10
  group_size: 2

task_name: "pretrain3"

# https://wandb.ai/multi-modal-uwaterloo/DisCo?nw=dwnouzpseop
ckpt_path: "/u2/l2hebert/MDT-2/src/logs/pretrain3/multiruns/2025-09-30_19-07-08/0/checkpoints/last.ckpt"
